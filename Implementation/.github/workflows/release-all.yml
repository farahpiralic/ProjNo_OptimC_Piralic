name: Build All Installers

# Generic natID installer workflow — builds Windows, macOS (arm64 + Intel) and
# Linux installers, and can publish them as a GitHub Release.
#
# TO USE: set the six values in the env: block below, save this file as
#         .github/workflows/release-all.yml, commit and push.
#
# Run it from the Actions tab, or push a tag (git tag v1.0.0 && git push origin v1.0.0)
# to build and publish a Release in one go.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases (yes/no)"
        required: false
        default: "no"
      release_tag:
        description: "Tag name for the Release (required if publishing, e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

# ============================ EDIT THESE ===================================
env:
  APP_NAME: optCompare                # GUI target name
  SOLUTION: optCompareSol            # SOLUTION_NAME from CMakeLists.txt
  PROJECT_REL: OptimCompare          # path under $HOME the config dev= expects
  CONFIG_DIR: installer               # folder in your repo holding <APP_NAME>.xml
  SDK_TAG: v4.2.1                     # confirmed from natID releases page
  SDK_DATE: 20260710                  # confirmed: date in the .7z asset names
# ===========================================================================

jobs:
# ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git %USERPROFILE%\natID
          mklink /J %USERPROFILE%\natID.SDK %USERPROFILE%\natID\natID.SDK
          mklink /J %USERPROFILE%\natID.Utils %USERPROFILE%\natID\natID.Utils
          curl -L -o %TEMP%\sdk-bin.7z https://github.com/idzafic/natID/releases/download/%SDK_TAG%/bin_win_x64_%SDK_DATE%.7z
          tar -xf %TEMP%\sdk-bin.7z -C %USERPROFILE%\natID.SDK\bin 2>nul || echo "will try 7z"

      - name: Extract SDK libs (7-Zip fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\natID.SDK\bin\mainUtils.dll")) {
            choco install 7zip -y --no-progress
            & "C:\Program Files\7-Zip\7z.exe" x -y -o"$env:USERPROFILE\natID.SDK\bin" "$env:TEMP\sdk-bin.7z"
          }
          Get-ChildItem "$env:USERPROFILE\natID.SDK\bin" -Filter *.dll | Select-Object -First 5 Name

      - name: Place project where the collector config expects it
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE $env:PROJECT_REL
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          cmd /c "mklink /J `"$target`" `"$env:GITHUB_WORKSPACE`""

      - name: Build (Release)
        shell: cmd
        run: |
          set HOME=%USERPROFILE%
          if not exist %USERPROFILE%\natID.RAMDisk mkdir %USERPROFILE%\natID.RAMDisk
          if not exist R:\ subst R: %USERPROFILE%\natID.RAMDisk
          cmake -S . -B %USERPROFILE%\natID.RAMDisk\build
          cmake --build %USERPROFILE%\natID.RAMDisk\build --config Release
          dir R:\Out\%SOLUTION%\Release

      - name: Put GTK dlls where the collector expects and fix drifted names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # In this SDK the GTK dlls ship flat in bin\GTK\ , but the collector's
          # GTK4.xml points at bin\GTK\release\bin\ . Mirror them there, then add
          # the handful of files whose names drifted between GTK versions.
          $srcGtk = "$env:USERPROFILE\natID.SDK\bin\GTK"
          $want   = "$env:USERPROFILE\natID.SDK\bin\GTK\release\bin"
          New-Item -ItemType Directory -Force -Path $want | Out-Null

          if (-not (Test-Path $srcGtk)) { throw "GTK folder not found at $srcGtk" }

          # 1) copy every dll found anywhere under bin\GTK into the expected folder
          #    (skip files already sitting in the destination, so we never copy onto self)
          Get-ChildItem $srcGtk -Recurse -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.DirectoryName -ieq $want) { return }
            Copy-Item $_.FullName -Destination (Join-Path $want $_.Name) -Force
          }
          Write-Host ("copied {0} dlls into {1}" -f (Get-ChildItem $want -Filter *.dll).Count, $want)

          # 2) provide the exact legacy names GTK4.xml still asks for, by copying
          #    from the real (renamed) dll this SDK actually ships.
          $map = @{
            "ffi-7.dll"      = @("ffi-8.dll");
            "jpeg-8.2.2.dll" = @("jpeg62.dll","turbojpeg.dll");
            "pkgconf-4.dll"  = @("pkgconf-7.dll");
            "png16-16.dll"   = @("libpng16.dll");
            "tiff4.dll"      = @("tiff.dll");
            "xml2-2.dll"     = @("xml2-16.dll");
            "z.dll"          = @("zlib1.dll");
          }
          foreach ($legacy in $map.Keys) {
            $dest = Join-Path $want $legacy
            if (Test-Path $dest) { Write-Host "  $legacy already present"; continue }
            $done = $false
            foreach ($real in $map[$legacy]) {
              $rp = Join-Path $want $real
              if (Test-Path $rp) { Copy-Item $rp -Destination $dest -Force; Write-Host "  $legacy  <=  $real"; $done=$true; break }
            }
            if (-not $done) { Write-Host "  WARNING: no source found for $legacy (looked for: $($map[$legacy] -join ', '))" }
          }

          # 3) report: does every name GTK4.xml lists now resolve?
          $need = @("adwaita-1-0","cairo-2","cairo-gobject-2","cairo-script-interpreter-2","epoxy-0",
                    "ffi-7","freetype-6","fribidi-0","gdk_pixbuf-2.0-0","gio-2.0-0","glib-2.0-0",
                    "gmodule-2.0-0","gobject-2.0-0","graphene-1.0-0","gthread-2.0-0","gtk-4-1",
                    "harfbuzz-gobject","harfbuzz-subset","harfbuzz","intl-8","jpeg-8.2.2","pango-1.0-0",
                    "pangocairo-1.0-0","pangowin32-1.0-0","pixman-1-0","pkgconf-4","png16-16","sass",
                    "tiff4","xml2-2","z")
          $missing = @()
          foreach ($n in $need) { if (-not (Test-Path (Join-Path $want "$n.dll"))) { $missing += "$n.dll" } }
          if ($missing.Count) { Write-Host ("STILL MISSING: {0}" -f ($missing -join ', ')) }
          else { Write-Host "all GTK4.xml names resolve OK" }

      - name: Collect installer
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          Copy-Item "$env:USERPROFILE\natID.SDK\DevEnv\SetupCollectors" "$env:USERPROFILE\Setups" -Recurse -Force
          Copy-Item "$env:CONFIG_DIR/$env:APP_NAME.xml" "$env:USERPROFILE\Setups\"
          # If you had to patch GTK4.xml, keep it in $CONFIG_DIR — the collector
          # reads Packages/*.xml from the SDK folder, so overwrite both copies.
          if (Test-Path "$env:CONFIG_DIR/GTK4.xml") {
            Copy-Item "$env:CONFIG_DIR/GTK4.xml" "$env:USERPROFILE\natID.SDK\DevEnv\SetupCollectors\Packages\GTK4.xml" -Force
            Copy-Item "$env:CONFIG_DIR/GTK4.xml" "$env:USERPROFILE\Setups\Packages\GTK4.xml" -Force
          }
          & "$env:USERPROFILE\natID.Utils\windows\SetupCollector.exe" "$env:USERPROFILE\Setups\$env:APP_NAME.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "dir /s /b R:\Setup"

      - name: Stage and zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          Get-ChildItem "R:\Setup" -File -Recurse -Include *.msi, "Install*.exe" | Copy-Item -Destination installer-output
          if (-not (Get-ChildItem installer-output -Filter *.msi)) {
            Write-Error "No .msi produced — SetupCollector failed (check log above)"; exit 1
          }
          Compress-Archive -Path installer-output/* -DestinationPath "$env:APP_NAME-win.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win
          path: ${{ env.APP_NAME }}-win.zip
          if-no-files-found: error

# ---------------------------------------------------------------------------
  macos-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          brew install sevenzip
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/$SDK_TAG/bin_macOS_arm64_$SDK_DATE.7z
          7zz x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls $HOME/natID.SDK/bin/lib/

      - name: Place project where the collector config expects it
        run: |
          mkdir -p "$HOME/$(dirname "$PROJECT_REL")"
          ln -s "$GITHUB_WORKSPACE" "$HOME/$PROJECT_REL"

      - name: Build (Release)
        run: |
          cmake -S . -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/natID.RAMDisk/build -j
          find $HOME/natID.RAMDisk/Out -maxdepth 4 -name "$APP_NAME*" -print

      - name: Collect installer
        run: |
          sudo ln -s $HOME/natID.RAMDisk /Volumes/RAMDisk
          cp -r $HOME/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/$CONFIG_DIR/$APP_NAME.xml" $HOME/Setups/
          chmod +x $HOME/natID.Utils/macOS/arm64/SetupCollector
          $HOME/natID.Utils/macOS/arm64/SetupCollector $HOME/Setups/$APP_NAME.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4

      - name: Stage and zip (ditto preserves exec permissions)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          cp -R $HOME/natID.RAMDisk/Setup/ALL_Bundles/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            cp -R $HOME/natID.RAMDisk/Setup/$APP_NAME/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/installer-output"
          APP=$(find . -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; ls -laR .; exit 1; }
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$APP_NAME-macOS-Silicon.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-Silicon
          path: installer-output/${{ env.APP_NAME }}-macOS-Silicon.zip
          if-no-files-found: error

# ---------------------------------------------------------------------------
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          brew install sevenzip
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/$SDK_TAG/bin_macOS_x64_$SDK_DATE.7z
          7zz x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z

      - name: Place project where the collector config expects it
        run: |
          mkdir -p "$HOME/$(dirname "$PROJECT_REL")"
          ln -s "$GITHUB_WORKSPACE" "$HOME/$PROJECT_REL"

      - name: Build (Release)
        run: |
          cmake -S . -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/natID.RAMDisk/build -j

      - name: Collect installer
        run: |
          sudo ln -s $HOME/natID.RAMDisk /Volumes/RAMDisk
          cp -r $HOME/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/$CONFIG_DIR/$APP_NAME.xml" $HOME/Setups/
          chmod +x $HOME/natID.Utils/macOS/x64/SetupCollector
          $HOME/natID.Utils/macOS/x64/SetupCollector $HOME/Setups/$APP_NAME.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4

      - name: Stage and zip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          cp -R $HOME/natID.RAMDisk/Setup/ALL_Bundles/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || \
            cp -R $HOME/natID.RAMDisk/Setup/$APP_NAME/* "$GITHUB_WORKSPACE/installer-output/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/installer-output"
          APP=$(find . -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; ls -laR .; exit 1; }
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$APP_NAME-macOS-Intel.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-Intel
          path: installer-output/${{ env.APP_NAME }}-macOS-Intel.zip
          if-no-files-found: error

# ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git p7zip-full patchelf \
            libgtk-4-dev libadwaita-1-dev

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          ln -s $HOME/natID/natID.SDK $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/$SDK_TAG/bin_linux_x64_$SDK_DATE.7z
          7z x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls $HOME/natID.SDK/bin/lib/

      - name: Place project where the collector config expects it
        run: |
          mkdir -p "$HOME/$(dirname "$PROJECT_REL")"
          ln -s "$GITHUB_WORKSPACE" "$HOME/$PROJECT_REL"

      - name: Build (Release)
        run: |
          cmake -S . -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/natID.RAMDisk/build -j$(nproc)
          test -x $HOME/natID.RAMDisk/Out/$SOLUTION/Release/$APP_NAME

      - name: Collect installer
        run: |
          # $RAMDisk maps to /media/RAMDisk on Linux; it must BE the symlink.
          sudo rm -rf /media/RAMDisk
          sudo ln -s $HOME/natID.RAMDisk /media/RAMDisk
          cp -r $HOME/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp "$GITHUB_WORKSPACE/$CONFIG_DIR/$APP_NAME.xml" $HOME/Setups/
          chmod +x $HOME/natID.Utils/linux/SetupCollector
          $HOME/natID.Utils/linux/SetupCollector $HOME/Setups/$APP_NAME.xml
          find $HOME/natID.RAMDisk/Setup -maxdepth 4

      - name: Stage and zip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/installer-output"
          find $HOME/natID.RAMDisk/Setup -name "*.deb" -exec cp {} "$GITHUB_WORKSPACE/installer-output/" \; || true
          test -n "$(ls -A "$GITHUB_WORKSPACE/installer-output/")" || { echo "no .deb produced"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          zip -j "$APP_NAME-linux.zip" installer-output/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: ${{ env.APP_NAME }}-linux.zip
          if-no-files-found: error

# ---------------------------------------------------------------------------
  release:
    needs: [windows, macos-silicon, macos-intel, linux]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'yes')
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ env.APP_NAME }} ${{ steps.tag.outputs.name }}
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows | `${{ env.APP_NAME }}-win.zip` (installer .exe + .msi — keep both together) |
            | macOS Apple Silicon | `${{ env.APP_NAME }}-macOS-Silicon.zip` |
            | macOS Intel | `${{ env.APP_NAME }}-macOS-Intel.zip` |
            | Linux (Ubuntu 24.04+) | `${{ env.APP_NAME }}-linux.zip` (contains .deb) |

            ### Install notes
            - **Windows**: unzip, run the .exe (or the .msi directly)
            - **macOS**: unzip, drag to Applications, first launch: right-click → Open
            - **Linux**: unzip, `sudo apt install ./*.deb`
          files: |
            artifacts/${{ env.APP_NAME }}-win/*
            artifacts/${{ env.APP_NAME }}-macOS-Silicon/*
            artifacts/${{ env.APP_NAME }}-macOS-Intel/*
            artifacts/${{ env.APP_NAME }}-linux/*
